<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thread Pilot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="/static/fonts/plus-jakarta-sans.css" rel="stylesheet">

    <style>
        :root {
            --bg: #F7F5FC;
            --sidebar: #EEE9F8;
            --surface: #FFFFFF;
            --text: #37304A;
            --text-muted: #7C748F;
            --accent: #6D5BD0;
            --accent-hover: #5B49BE;
            --accent-soft: #E6E0FA;
            --border: #E5DFF1;
            --danger: #D9485F;
            --success: #2E9E6B;
            --shadow-sm: 0 1px 2px rgba(55, 48, 74, 0.06);
            --shadow-md: 0 6px 24px rgba(109, 91, 208, 0.10);
            --sidebar-width: 280px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        button,
        select,
        textarea {
            font-family: inherit;
        }

        svg {
            display: block;
        }

        /* ---------- Sidebar ---------- */

        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 6px 18px;
        }

        .logo-mark {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: linear-gradient(135deg, var(--accent), #9B8CEB);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(109, 91, 208, 0.30);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .brand-tagline {
            font-size: 12px;
            color: var(--text-muted);
        }

        .new-chat {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            padding: 11px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 22px;
            transition: background 0.15s ease;
        }

        .new-chat:hover {
            background: var(--accent-hover);
        }

        .history-title {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0 0 8px;
            padding-left: 8px;
        }

        #conversationList {
            overflow-y: auto;
            flex: 1;
            padding-right: 2px;
        }

        .history-item {
            position: relative;
            padding: 9px 12px;
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: rgba(109, 91, 208, 0.08);
        }

        .history-item.active {
            background: var(--surface);
            color: var(--accent);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .history-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            border-radius: 3px;
            background: var(--accent);
        }

        /* ---------- Main area ---------- */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg);
            min-width: 0;
        }

        .topbar {
            height: 60px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            font-size: 15px;
            font-weight: 600;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 5px 12px;
            border-radius: 999px;
        }

        .status::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px 24px 170px;
        }

        .welcome {
            max-width: 760px;
            margin: 80px auto 0;
            text-align: center;
        }

        .welcome .logo-mark {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            margin: 0 auto 18px;
        }

        .welcome h1 {
            font-size: 30px;
            margin: 0 0 8px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .welcome p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 760px;
            margin: 32px auto;
        }

        .card {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .card-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .card-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ---------- Messages ---------- */

        .message {
            max-width: 820px;
            margin: 0 auto 22px;
            display: flex;
            gap: 12px;
            line-height: 1.65;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message.user .avatar {
            order: 2;
        }

        .message.user .message-content {
            order: 1;
            background: var(--accent);
            color: #fff;
            border-radius: 16px 16px 4px 16px;
            padding: 11px 16px;
            max-width: 70%;
        }

        .message.assistant .message-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px 16px 16px 16px;
            padding: 14px 18px;
            max-width: 78%;
            box-shadow: var(--shadow-sm);
        }

        .message.assistant .message-content:empty::after {
            content: "…";
            color: var(--text-muted);
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .user-avatar {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--accent);
        }

        .bot-avatar {
            background: linear-gradient(135deg, var(--accent), #9B8CEB);
            color: #fff;
        }

        .message-content {
            color: var(--text);
            font-size: 15px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .tool-progress {
            max-width: 820px;
            margin: 0 auto 12px;
            padding-left: 46px;
            display: flex;
            justify-content: flex-start;
        }

        .tool-progress-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-soft);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .tool-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid rgba(109, 91, 208, 0.25);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .tool-check {
            color: var(--success);
            font-weight: bold;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- Composer ---------- */

        .input-area {
            position: fixed;
            bottom: 0;
            left: var(--sidebar-width);
            right: 0;
            background: linear-gradient(to top, var(--bg) 78%, rgba(247, 245, 252, 0));
            padding: 24px 24px 18px;
        }

        .input-wrapper {
            max-width: 820px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            padding: 10px;
            box-shadow: var(--shadow-md);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(109, 91, 208, 0.12), var(--shadow-md);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .icon-btn:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .attach-btn {
            margin-right: 4px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text);
            font-size: 15px;
            min-height: 30px;
            max-height: 170px;
            line-height: 1.5;
            padding: 8px 6px;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .model-select {
            height: 40px;
            max-width: 150px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 10px;
            margin-left: 8px;
            outline: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            flex-shrink: 0;
        }

        .model-select:hover,
        .model-select:focus {
            border-color: var(--accent);
        }

        .model-select option {
            background: var(--surface);
            color: var(--text);
        }

        .mic-btn {
            margin-left: 6px;
        }

        .mic-btn.recording {
            background: var(--danger);
            color: #fff;
            animation: pulseMic 1.2s infinite;
        }

        @keyframes pulseMic {
            0% {
                box-shadow: 0 0 0 0 rgba(217, 72, 95, 0.45);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(217, 72, 95, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(217, 72, 95, 0);
            }
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            margin-left: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }

        .send-btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .notice {
            color: var(--text-muted);
            font-size: 12px;
            max-width: 820px;
            margin: 10px auto 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .input-area {
                left: 0;
                padding: 16px 12px 12px;
            }

            .chat-container {
                padding: 24px 16px 170px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .message.user .message-content,
            .message.assistant .message-content {
                max-width: 84%;
            }

            .model-select {
                max-width: 95px;
                font-size: 11px;
                padding: 0 6px;
            }

            .icon-btn,
            .send-btn {
                width: 36px;
                height: 36px;
            }
        }

        /* ---------- Markdown in assistant replies ---------- */

        .message-content.markdown {
            white-space: normal;
        }

        .markdown > :first-child { margin-top: 0; }
        .markdown > :last-child { margin-bottom: 0; }

        .markdown p { margin: 0 0 10px; }

        .markdown h1, .markdown h2, .markdown h3, .markdown h4 {
            margin: 16px 0 8px;
            line-height: 1.3;
            font-weight: 700;
        }

        .markdown h1 { font-size: 20px; }
        .markdown h2 { font-size: 18px; }
        .markdown h3, .markdown h4 { font-size: 16px; }

        .markdown strong { font-weight: 700; color: var(--text); }

        .markdown ul, .markdown ol { margin: 0 0 10px; padding-left: 22px; }
        .markdown li { margin: 3px 0; }
        .markdown li::marker { color: var(--accent); }

        .markdown a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

        .markdown code {
            font-family: "Cascadia Code", Consolas, "SFMono-Regular", monospace;
            font-size: 13px;
            background: var(--accent-soft);
            color: #4B3AA8;
            padding: 1px 6px;
            border-radius: 6px;
        }

        .markdown pre {
            background: #2B2540;
            color: #F1EEFA;
            padding: 14px 16px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 0 0 12px;
            line-height: 1.5;
        }

        .markdown pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }

        .markdown blockquote {
            margin: 0 0 10px;
            padding: 4px 14px;
            border-left: 3px solid var(--accent);
            color: var(--text-muted);
        }

        .markdown table {
            border-collapse: collapse;
            margin: 0 0 12px;
            font-size: 14px;
            display: block;
            overflow-x: auto;
        }

        .markdown th, .markdown td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: left;
        }

        .markdown th { background: var(--bg); font-weight: 600; }

        .markdown hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    </style>

    <script src="/static/js/marked.min.js"></script>
    <script src="/static/js/purify.min.js"></script>
</head>

<body>

<aside class="sidebar">
    <div class="brand">
        <div class="logo-mark">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </div>
        <div class="brand-text">
            <span class="brand-name">Thread Pilot</span>
            <span class="brand-tagline">Your research co-pilot</span>
        </div>
    </div>

    <button class="new-chat" onclick="newChat()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New thread
    </button>

    <div class="history-title">Your threads</div>
    <div id="conversationList"></div>
</aside>

<main class="main">
    <div class="topbar">
        <div>Thread Pilot</div>
        <div class="status" id="status">Ready</div>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-area">
        <div class="input-wrapper">

            <input
                type="file"
                id="fileInput"
                style="display: none;"
                accept=".pdf,.docx,.txt,.md,.py,.csv"
                onchange="uploadFile()"
            >

            <button class="icon-btn attach-btn" onclick="openFilePicker()" title="Upload document" aria-label="Upload document">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>

            <textarea
                id="messageInput"
                placeholder="Message Thread Pilot..."
                rows="1"
                oninput="autoResize(this)"
                onkeydown="handleKeyDown(event)"
            ></textarea>

            <select id="modelSelect" class="model-select" title="Select model">
                <option value="">Loading models...</option>
            </select>

            <button class="icon-btn mic-btn" id="micBtn" onclick="toggleDictation()" title="Dictate" aria-label="Dictate"></button>

            <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send" aria-label="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
            </button>
        </div>

        <div class="notice" id="noticeText"></div>
    </div>
</main>

<script>
    const NOTICE_DEFAULT = "Answers are AI-generated and may be inaccurate — double-check anything important.";

    const MIC_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>';
    const STOP_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
    const BOT_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>';

    const ICON_GLOBE = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
    const ICON_DOC = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>';
    const ICON_BOOKMARK = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
    const ICON_CALC = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h8"/></svg>';
    const chatContainer = document.getElementById("chatContainer");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("status");
    const conversationList = document.getElementById("conversationList");
    const modelSelect = document.getElementById("modelSelect");
    const noticeText = document.getElementById("noticeText");
    const micBtn = document.getElementById("micBtn");

    micBtn.innerHTML = MIC_ICON;
    noticeText.textContent = NOTICE_DEFAULT;

    // crypto.randomUUID() only exists in secure contexts (HTTPS/localhost),
    // so fall back to crypto.getRandomValues() when served over plain HTTP.
    function generateUUID() {
        if (window.crypto && typeof crypto.randomUUID === "function") {
            return crypto.randomUUID();
        }
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        bytes[6] = (bytes[6] & 0x0f) | 0x40; // version 4
        bytes[8] = (bytes[8] & 0x3f) | 0x80; // variant 10
        const hex = Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
        return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
    }

    let threadId = localStorage.getItem("thread_id");

    if (!threadId) {
        threadId = generateUUID();
        localStorage.setItem("thread_id", threadId);
    }

    async function loadModels() {
        if (!modelSelect) return;

        try {
            const res = await fetch("/models");
            const data = await res.json();

            modelSelect.innerHTML = "";
            for (const m of data.models) {
                const opt = document.createElement("option");
                opt.value = m.id;
                opt.textContent = m.label;
                modelSelect.appendChild(opt);
            }

            const savedModel = localStorage.getItem("selected_model");
            const ids = data.models.map(m => m.id);
            modelSelect.value = ids.includes(savedModel) ? savedModel : data.default;
        } catch (e) {
            modelSelect.innerHTML = '<option value="">default</option>';
        }
    }

    loadModels();

    if (modelSelect) {
        modelSelect.addEventListener("change", () => {
            localStorage.setItem("selected_model", modelSelect.value);

            if (noticeText) {
                noticeText.textContent = `Selected model: ${modelSelect.value}`;
            }
        });
    }

    let recognition = null;
    let isDictating = false;

    function setupSpeechRecognition() {
        const SpeechRecognition =
            window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            return null;
        }

        const speechRecognition = new SpeechRecognition();

        speechRecognition.lang = "en-US";
        speechRecognition.continuous = true;
        speechRecognition.interimResults = true;

        speechRecognition.onstart = () => {
            isDictating = true;

            if (micBtn) {
                micBtn.classList.add("recording");
                micBtn.innerHTML = STOP_ICON;
            }

            statusText.textContent = "Listening...";
        };

        speechRecognition.onresult = (event) => {
            let finalTranscript = "";
            let interimTranscript = "";

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;

                if (event.results[i].isFinal) {
                    finalTranscript += transcript + " ";
                } else {
                    interimTranscript += transcript;
                }
            }

            if (finalTranscript) {
                const currentText = messageInput.value.trim();

                messageInput.value = currentText
                    ? currentText + " " + finalTranscript.trim()
                    : finalTranscript.trim();

                autoResize(messageInput);
            }

            if (interimTranscript && noticeText) {
                noticeText.textContent = "Listening: " + interimTranscript;
            }
        };

        speechRecognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);

            if (event.error === "not-allowed") {
                alert("Microphone permission denied. Please allow microphone access.");
            }

            stopDictation();
        };

        speechRecognition.onend = () => {
            if (isDictating) {
                try {
                    speechRecognition.start();
                } catch (error) {
                    stopDictation();
                }
            }
        };

        return speechRecognition;
    }

    function toggleDictation() {
        if (!recognition) {
            recognition = setupSpeechRecognition();
        }

        if (!recognition) {
            alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
            return;
        }

        if (isDictating) {
            stopDictation();
        } else {
            startDictation();
        }
    }

    function startDictation() {
        try {
            recognition.start();
        } catch (error) {
            console.error("Could not start dictation:", error);
        }
    }

    function stopDictation() {
        isDictating = false;

        if (recognition) {
            try {
                recognition.stop();
            } catch (error) {
                console.error("Could not stop dictation:", error);
            }
        }

        if (micBtn) {
            micBtn.classList.remove("recording");
            micBtn.innerHTML = MIC_ICON;
        }

        statusText.textContent = "Ready";

        if (noticeText) {
            noticeText.textContent = NOTICE_DEFAULT;
        }

        messageInput.focus();
    }

    function autoResize(textarea) {
        textarea.style.height = "auto";
        textarea.style.height = textarea.scrollHeight + "px";
    }

    function hideWelcome() {
        const welcome = document.getElementById("welcome");
        const cards = document.getElementById("cards");

        if (welcome) welcome.style.display = "none";
        if (cards) cards.style.display = "none";
    }

    function handleKeyDown(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function usePrompt(text) {
        messageInput.value = text;
        autoResize(messageInput);
        messageInput.focus();
    }

    function openFilePicker() {
        document.getElementById("fileInput").click();
    }

    function setMessageText(el, text) {
        el.dataset.raw = text;

        if (el.classList.contains("markdown") && window.marked && window.DOMPurify) {
            el.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
        } else {
            el.textContent = text;
        }
    }

    function appendMessageText(el, more) {
        setMessageText(el, (el.dataset.raw || "") + more);
    }

    function addMessage(role, content = "") {
        hideWelcome();

        const messageDiv = document.createElement("div");
        messageDiv.className = role === "user"
            ? "message user"
            : "message assistant";

        const avatar = document.createElement("div");
        avatar.className = role === "user"
            ? "avatar user-avatar"
            : "avatar bot-avatar";

        if (role === "user") {
            avatar.textContent = "You";
        } else {
            avatar.innerHTML = BOT_ICON;
        }

        const messageContent = document.createElement("div");
        messageContent.className = role === "user"
            ? "message-content"
            : "message-content markdown";
        setMessageText(messageContent, content);

        messageDiv.appendChild(avatar);
        messageDiv.appendChild(messageContent);

        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        return messageContent;
    }

    function detectLikelyTool(message) {
        const text = message.toLowerCase();

        const mathPattern = /(\d+\s*[\+\-\*\/]\s*\d+)|calculate|calculation|math|solve/;
        const ragPattern = /document|pdf|file|uploaded|summarize|summary|according to|based on/;
        const memorySavePattern = /remember that|save this|store this|keep in memory|memorize/;
        const memoryRecallPattern = /what do you remember|recall|my memory|remember about me/;

        const webSearchPattern =
            /latest|current|today|now|recent|news|search web|web search|internet|online|price|version|update|2025|2026|who is|what is happening|trending|release|new model|current ceo|latest version/;

        if (memorySavePattern.test(text)) {
            return "Memory Save";
        }

        if (memoryRecallPattern.test(text)) {
            return "Memory Recall";
        }

        if (ragPattern.test(text)) {
            return "Document Search";
        }

        if (webSearchPattern.test(text)) {
            return "Web Search";
        }

        if (mathPattern.test(text)) {
            return "Calculator";
        }

        return null;
    }

    function addToolProgress(toolName) {
        const wrapper = document.createElement("div");
        wrapper.className = "tool-progress";

        const box = document.createElement("div");
        box.className = "tool-progress-box";

        const icon = document.createElement("span");
        icon.className = "tool-spinner";

        const text = document.createElement("span");
        text.textContent = `Using ${toolName}...`;

        box.appendChild(icon);
        box.appendChild(text);
        wrapper.appendChild(box);

        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        return {
            wrapper,
            icon,
            text
        };
    }

    function completeToolProgress(toolProgress, toolName) {
        if (!toolProgress) return;

        toolProgress.icon.className = "tool-check";
        toolProgress.icon.textContent = "✓";
        toolProgress.text.textContent = `${toolName} completed`;
    }

    async function loadConversations() {
        try {
            const response = await fetch("/conversations");
            const data = await response.json();

            conversationList.innerHTML = "";

            if (!data.conversations || data.conversations.length === 0) {
                conversationList.innerHTML = `
                    <div class="history-item">No chats yet</div>
                `;
                return;
            }

            data.conversations.forEach(conv => {
                const item = document.createElement("div");
                item.className = "history-item";

                if (conv.thread_id === threadId) {
                    item.classList.add("active");
                }

                item.textContent = conv.title || "New Chat";
                item.onclick = () => loadConversation(conv.thread_id);

                conversationList.appendChild(item);
            });

        } catch (error) {
            console.error("Failed to load conversations:", error);
        }
    }

    async function loadConversation(selectedThreadId) {
        threadId = selectedThreadId;
        localStorage.setItem("thread_id", threadId);

        try {
            const response = await fetch(`/history/${threadId}`);
            const data = await response.json();

            chatContainer.innerHTML = "";

            if (!data.messages || data.messages.length === 0) {
                renderWelcome();
                await loadConversations();
                return;
            }

            data.messages.forEach(msg => {
                addMessage(
                    msg.role === "user" ? "user" : "assistant",
                    msg.content
                );
            });

            await loadConversations();

        } catch (error) {
            console.error("Failed to load conversation:", error);
        }
    }

    function renderWelcome() {
        const suggestions = [
            { icon: ICON_GLOBE, title: "Catch up on the web", sub: "Latest news on AI agents", prompt: "Search the web for latest AI agent news." },
            { icon: ICON_DOC, title: "Summarize a document", sub: "Key points from your upload", prompt: "Summarize the document I uploaded." },
            { icon: ICON_BOOKMARK, title: "Remember a detail", sub: "Save a fact for later chats", prompt: "Remember that my favourite programming language is Python." },
            { icon: ICON_CALC, title: "Crunch some numbers", sub: "Quick calculations", prompt: "Calculate 125 * 48 / 6" }
        ];

        chatContainer.innerHTML = `
            <div class="welcome" id="welcome">
                <div class="logo-mark">${BOT_ICON}</div>
                <h1>Where should we start?</h1>
                <p>Upload a document, search the web, or pick up a thread from your memory.</p>
            </div>
            <div class="cards" id="cards"></div>
        `;

        const cards = document.getElementById("cards");

        suggestions.forEach(s => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <div class="card-icon">${s.icon}</div>
                <div>
                    <div class="card-title">${s.title}</div>
                    <div class="card-sub">${s.sub}</div>
                </div>
            `;
            card.onclick = () => usePrompt(s.prompt);
            cards.appendChild(card);
        });
    }

    function parseSSEPart(part) {
        const lines = part
            .split(/\r?\n/)
            .filter(line => line.trim().startsWith("data:"));

        if (lines.length === 0) {
            return null;
        }

        const jsonText = lines
            .map(line => line.replace(/^data:\s*/, ""))
            .join("\n")
            .trim();

        if (!jsonText || jsonText === "[DONE]") {
            return null;
        }

        try {
            return JSON.parse(jsonText);
        } catch (error) {
            console.error("Invalid stream JSON:", jsonText, error);
            return null;
        }
    }

    async function sendMessage() {
        const message = messageInput.value.trim();

        if (!message) return;

        if (isDictating) {
            stopDictation();
        }

        const selectedModel = modelSelect ? modelSelect.value : "";

        addMessage("user", message);

        messageInput.value = "";
        messageInput.style.height = "auto";

        sendBtn.disabled = true;
        statusText.textContent = `Thinking with ${selectedModel}...`;

        const likelyTool = detectLikelyTool(message);
        let toolProgress = null;

        if (likelyTool) {
            toolProgress = addToolProgress(likelyTool);
            statusText.textContent = `Using ${likelyTool}...`;
        }

        const botElement = addMessage("assistant", "");

        let firstTokenReceived = false;

        function handleStreamData(data) {
            if (!data) return;

            if (data.token !== undefined && data.token !== null) {
                if (!firstTokenReceived) {
                    firstTokenReceived = true;

                    if (likelyTool && toolProgress) {
                        completeToolProgress(toolProgress, likelyTool);
                    }

                    statusText.textContent = `Generating with ${selectedModel}...`;
                }

                appendMessageText(botElement, data.token);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            if (data.error) {
                if (likelyTool && toolProgress) {
                    completeToolProgress(toolProgress, likelyTool);
                }

                appendMessageText(botElement, "\n\n**Error:** " + data.error);
                statusText.textContent = "Ready";
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            if (data.done) {
                if (likelyTool && toolProgress && !firstTokenReceived) {
                    completeToolProgress(toolProgress, likelyTool);
                }

                statusText.textContent = "Ready";
            }
        }

        try {
            const response = await fetch("/chat/stream", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    thread_id: threadId,
                    model: selectedModel
                })
            });

            if (!response.ok) {
                let errorText = "Request failed.";

                try {
                    const errorData = await response.json();
                    errorText = errorData.error || errorData.detail || errorData.message || errorText;
                } catch (error) {
                    console.error("Could not parse error response:", error);
                }

                setMessageText(botElement, errorText);
                return;
            }

            if (!response.body) {
                setMessageText(botElement, "Streaming is not supported by this browser.");
                return;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");

            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();

                if (done) {
                    break;
                }

                buffer += decoder.decode(value, { stream: true });

                const parts = buffer.split(/\r?\n\r?\n/);
                buffer = parts.pop() || "";

                for (const part of parts) {
                    const data = parseSSEPart(part);
                    handleStreamData(data);
                }
            }

            /*
                Important fix:
                Sometimes the final streamed response does not end with "\n\n".
                In that case, the final data remains inside buffer.
                This part makes sure the leftover buffer is also displayed.
            */
            buffer += decoder.decode();

            if (buffer.trim()) {
                const data = parseSSEPart(buffer);
                handleStreamData(data);
            }

        } catch (error) {
            console.error("Streaming error:", error);

            if (likelyTool && toolProgress) {
                completeToolProgress(toolProgress, likelyTool);
            }

            setMessageText(botElement, "Something went wrong: " + error.message);

        } finally {
            sendBtn.disabled = false;
            statusText.textContent = "Ready";
            messageInput.focus();

            await loadConversations();
        }
    }

    async function uploadFile() {
        const fileInput = document.getElementById("fileInput");

        if (!fileInput.files.length) {
            return;
        }

        const file = fileInput.files[0];

        addMessage("user", `📎 Uploaded document: ${file.name}`);

        const toolProgress = addToolProgress("Document Ingestion");
        statusText.textContent = "Using Document Ingestion...";

        const formData = new FormData();
        formData.append("file", file);
        formData.append("thread_id", threadId);

        try {
            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            completeToolProgress(toolProgress, "Document Ingestion");

            if (data.success) {
                addMessage(
                    "assistant",
                    data.message + "\n\nYou can now ask questions about this document."
                );

                await loadConversations();
            } else {
                addMessage("assistant", "Upload failed: " + data.message);
            }

        } catch (error) {
            completeToolProgress(toolProgress, "Document Ingestion");
            addMessage("assistant", "Upload failed: " + error.message);
        }

        statusText.textContent = "Ready";
        fileInput.value = "";
    }

    async function newChat() {
        threadId = generateUUID();
        localStorage.setItem("thread_id", threadId);

        if (isDictating) {
            stopDictation();
        }

        renderWelcome();
        await loadConversations();
        messageInput.focus();
    }

    renderWelcome();
    loadConversations();

    if (threadId) {
        loadConversation(threadId);
    }
</script>
